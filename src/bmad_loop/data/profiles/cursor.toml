# Cursor Agent CLI (`cursor-agent` / `agent`). Unattended runs use `--print`
# (headless): `--trust` is rejected without it, and interactive sessions stall
# on the Workspace Trust dialog in fresh dirs / worktrees. With `--print` the
# process exits when the turn finishes — SessionEnd + window-death cover
# completion. Skills live in `.agents/skills/` (shared with codex/gemini/
# copilot). Hook config reuses the Copilot dialect (versioned JSON with flat
# `{command:…}` handlers) at `.cursor/hooks.json`.
#
# Native events: sessionStart / sessionEnd fire reliably. `stop` is registered
# but was not observed on single-turn print or interactive smokes, nor on
# multi-subagent review passes during E2E bring-up — keep it mapped in case a
# future build fires it; completion must not depend on it.
#
# Prompt strategy mirrors Copilot: do not rely on slash-command expansion of
# the initial prompt argument — load SKILL.md by path instead. usage_parser is
# "none": Cursor Agent transcripts under
# ~/.cursor/projects/*/agent-transcripts/**/*.jsonl carry no token fields yet.
#
# E2E-verified: sprint-mode run, forced follow-up review, stop/resume,
# worktree isolation + merge-back, and deferred-work sweep triage+bundle
# (Cursor Agent CLI 2026.07.09).
name = "cursor"
binary = "cursor-agent"
skill_tree = ".agents/skills"
prompt_template = 'LOAD the FULL .agents/skills/{skill}/SKILL.md, read its entire contents and follow its directions exactly, using subagents as needed: {args}'
launch_args = ["--print"]
bypass_args = ["--force", "--trust", "--approve-mcps"]
model_flag = "--model"
usage_parser = "none"
first_run_note = "run `cursor-agent login` once before `bmad-loop run`; profile uses --print/--trust for unattended runs (interactive --trust is rejected). Requires Cursor Agent CLI (`cursor-agent` / `agent`)"
seed_files = [".cursor/hooks.json", ".cursor/mcp.json"]

[hooks]
dialect = "copilot-settings-json"
config_path = ".cursor/hooks.json"
events = { sessionStart = "SessionStart", stop = "Stop", sessionEnd = "SessionEnd" }
