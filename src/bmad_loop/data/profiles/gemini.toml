# Google Gemini CLI (>= 0.46, hooks on by default). -i keeps the session
# interactive with the slash command as the initial prompt (a positional
# prompt would force headless mode). AfterAgent is the turn-complete event,
# mapped to canonical Stop. Custom commands live in .gemini/commands/, skills
# in .agents/skills/.
name = "gemini"
binary = "gemini"
prompt_template = "{prompt}"
launch_args = ["-i"]
bypass_args = ["--approval-mode=yolo"]
model_flag = "--model"
usage_parser = "gemini-chat"
first_run_note = "authenticate once (browser OAuth or GEMINI_API_KEY); requires Gemini CLI >= 0.46"
skill_tree = ".agents/skills"
# .gemini/settings.json holds project MCP servers (mcpServers) AND is the hook
# config_path: it is seeded first, then the Stop hook is merged in, so a worktree
# keeps the project's MCP servers instead of starting from an empty settings file.
seed_files = [".gemini/settings.json"]

[env]
GEMINI_CLI_TRUST_WORKSPACE = "true"

[hooks]
dialect = "gemini-settings-json"
config_path = ".gemini/settings.json"
events = { SessionStart = "SessionStart", AfterAgent = "Stop", SessionEnd = "SessionEnd" }

# The home-relative skill folders Gemini CLI loads on its own, read only with
# `[skills] user_roots = true` (see bmad_loop.skill_locate). Workspace skills
# beat user skills, and ~/.agents/skills beats ~/.gemini/skills; GEMINI_CLI_HOME
# moves both away from the home directory.
# Source: https://geminicli.com/docs/cli/skills/ (2026-11-15).
[user_skills]
precedence = "project"
roots = [
  { path = "~/.agents/skills", disabled_by = [
    "GEMINI_CLI_HOME",
  ] },
  { path = "~/.gemini/skills", disabled_by = [
    "GEMINI_CLI_HOME",
  ] },
]
