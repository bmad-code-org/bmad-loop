# Claude Code. Reference profile for the claude-settings-json hook dialect.
name = "claude"
binary = "claude"
prompt_template = "{prompt}"
bypass_args = ["--permission-mode", "bypassPermissions"]
model_flag = "--model"
# Caller-chosen session id (DW-505): the adapter mints a UUID4 per launch and pins
# hook-event attribution to it, so a nested child's SessionEnd is foreign even
# without a SessionStart (DW-508). Probed on Claude Code 2.1.284 (zero-token tmux
# probe, 2026-09-28): SessionStart's session_id equals the --session-id value.
session_id_flag = "--session-id"
usage_parser = "claude-jsonl"
first_run_note = "run `claude` once in the project to accept workspace trust and hooks approval"
skill_tree = ".claude/skills"
# Gitignored configs a worktree checkout omits: project MCP servers (.mcp.json)
# and Claude settings. .claude/settings.json is also the hook config_path — it is
# seeded first, then the Stop hook is merged into it (see provision_worktree).
seed_files = [
  ".mcp.json",
  ".claude/settings.json",
  ".claude/settings.local.json",
]

# Transport-failure classification (#194, #507, #323): regexes matched
# line-by-line against the ANSI-stripped 64 KiB tail of a non-completed
# (timeout/stalled/crashed) session's pane log, once the verdict has settled. A
# match reclassifies the session as an environment fault so the orchestrator can
# PAUSE (and re-arm with a fresh budget) instead of charging a dev attempt for a
# session that never got usable work out of the API.
#
# The scanned file is a tmux pane capture, so it carries THE MODEL'S OWN OUTPUT:
# an assertion, an acceptance criterion or a doc bullet that merely writes ABOUT
# a provider error lands in the scanned bytes. So every alternative below
# reproduces the whole FIRST sentence of one captured Claude Code error message
# rather than a framing token plus a loose cause — a paraphrase cannot reach it.
# Each is a first-sentence PREFIX match: nothing anchors the sentence's end or
# requires the rest of the message, so a line that quotes that first sentence
# verbatim still matches. Every one is a captured line:
#   * `API Error` … `Unable to connect to API` — #194's evidence, run
#     20260718-191419-44e7 on this adapter.
#   * `API Error` … `Connection closed mid-response`, and the 5xx pair
#     (`529 Overloaded` / `500 Internal server error`) — Claude Code transcript
#     entries structurally tagged "isApiErrorMessage": true.
#
# The 5xx statuses are ENUMERATED, not ranged. A `5[0-9][0-9]` range admits 100
# codes against either reason phrase when exactly two pairings were ever
# captured, so an unverified string — `API Error` … `503 Internal server error`,
# which is what a story writing an HTTP error path prints — would pause the run.
# Same evidentiary bar as the quota note below: seed the captured pairing, never
# the plausible one.
#
# The single-character classes (`t[o]`, `respons[e]`, `5[2]9`, `5[0]0`) are
# load-bearing, not typos: each makes its pattern fail to match its OWN line
# here, so a session that prints or diffs this profile does not read its own
# configuration as a provider outage (#507). Pinned by
# test_shipped_patterns_do_not_match_their_own_profile_line.
#
# No usage-limit / quota cause is seeded HERE: on a pane capture that vocabulary
# is what a story IMPLEMENTING rate limiting prints all day. The two captured
# Claude Code usage-limit sentences live in their own class below
# (usage_limit_patterns / usage_wait_patterns), which is looked at on the live
# pane and is exempt from the token veto only there. Seed any further one only
# from a captured line, citing the run it came from — the bar
# test_unseeded_profiles_stay_inert states.
#
# To disable or extend, copy this profile into .bmad-loop/profiles/ and edit.
env_fault_patterns = [
  "API Error: Unable to connect t[o] API",
  "API Error: Connection closed mid-respons[e]",
  "API Error: (5[2]9 Overloaded|5[0]0 Internal server error)",
]

# Parked-prompt patterns (DW-350): regexes matched line-by-line against the
# ANSI-stripped VISIBLE pane (`capture-pane -p`), consulted only at the instant a
# stall wake nudge is about to be typed. When no single row matches, runs of 2-3
# adjacent rows are joined and tried too, so a line a narrow pane wrapped still
# matches (the footer wraps below 33 columns). A match withholds the nudge — its
# trailing Enter can ANSWER the prompt (#727: it confirmed "No, exit" on the
# Bypass Permissions dialog) — and ends the session as parked, which pauses the
# run for a human instead of retrying.
#
# Same evidentiary bar as env_fault_patterns above: seed only lines captured from
# the CLI's own screen. Both entries are from #727's captured pane (Claude Code
# 2.1.246, run 20260826-114252-3da1) — the dialog's heading and its footer. The
# footer is also the workspace trust prompt's, captured parked for 80 s (Claude
# Code 2.1.284, DW-339: tests/fixtures/claude-trust-prompt-parked.pipe-pane.log),
# so that one entry labels both dialogs. The single-character classes (`mod[e]`,
# `t[o]`) keep each pattern from matching its own line here, so a session that
# prints or diffs this profile does not read as parked; pinned by the
# parked-pattern tests in tests/test_profile.py.
parked_prompt_patterns = [
  "WARNING: Claude Code running in Bypass Permissions mod[e]",
  "Enter to confirm · Esc t[o] cancel",
]

# Usage-limit patterns (#610): regexes matched line-by-line against the
# ANSI-stripped VISIBLE pane at stall-grace expiry and when the session timeout
# fires, and across 2-3 wrapped rows when no single row matches. A live match withholds the stall nudge and ends the session parked with
# a usage-limit pause reason, exempt from the token veto (the line is on screen
# now); the same patterns also scan the post-mortem log tail as ordinary
# env-fault families, where the veto still applies (a limit the session
# recovered from must not excuse a later real stall).
#
# usage_limit_patterns — BLOCKED, no auto-continue: credit exhaustion, the pane
# line `You're out of usage credit` + `s. Run /usage-credits to keep using
# <model> or /model to switch models.`, captured on psmux/Windows 11 (bmad-loop
# 0.11.1) in runs 20260907-084618-824f (dev-1 and review-1) and
# 20260907-090132-98e3 (dev-1 and dev-2). The model name is deliberately left
# out of the anchor: it is whatever model the operator runs, so pinning it would
# miss the next capture.
#
# usage_wait_patterns — blocked but WAITING for a reset Claude Code then
# continues from on its own (autoContinueAtUsageLimit): the session-window
# limit, the pane line `You've hit your session limi` + `t · resets <time>`,
# optionally followed by a ` (<Area/City>)` zone. Captured twice: the 2026-09-07
# psmux/Windows capture (zone suffix present) and run 20260913-165153-b850 on
# macOS/tmux (no zone). The anchor stops at the `· resets` separator, which both
# captures share. The same pane prints an advisory family thirteen times for
# every two real hits — `You've used <N>% of your session` + ` limit · resets`
# — from a session that is still working; `hit your` versus `used <N>% of your`
# is what separates them, so the advisory can never reach this anchor.
#
# Both seeds keep ASCII apostrophes (both reports pasted ANSI-stripped logs), and
# the single-character classes (`credit[s]`, `[.]`, `limi[t]`) keep each pattern
# from matching its own line here — pinned, with the corpus, in
# tests/test_env_fault_patterns.py. `[.]` rather than a backslash escape: a TOML
# basic string rejects that escape.
usage_limit_patterns = ["You're out of usage credit[s][.] Run /usage-credits"]
usage_wait_patterns = ["You've hit your session limi[t] · resets"]

# Auto-deny countdown: the line Claude Code prints above a permission prompt on
# an unattended session, read once when a PermissionPrompt latches into the
# `session-parked` journal event's `auto_deny_at`. Captured in the #855 report
# (Claude Code 2.1.288, tmux 3.7c/macOS) as `⚠ Claude Code will automatically
# deny this reques` + `t in 2:00, to avoid blocking progress on an unattended
# session`. `reques[t]` keeps the pattern from matching its own line here, as
# the usage seeds above do. A literal (single-quoted) string, so a regex escape
# never needs doubling. The named groups `min` and `sec` are required.
auto_deny_patterns = [
  'automatically deny this reques[t] in (?P<min>[0-9]+):(?P<sec>[0-9]{2})',
]

# Answer keys for a parked permission prompt, offered in the TUI as Y (approve)
# and N (deny). The keys go out only when a fresh capture of the visible pane
# matches EVERY guard of that choice: Enter confirms whatever option is focused
# (on the bypass startup dialog that is "No, exit") and Escape there exits
# Claude, so both choices require the prompt's own question, and approve also
# requires the focus marker on option 1. Guards come from the screen captured
# in the #855 report (the question line, then the focused option 1 "Yes" over
# option 2 "No"); the `[d]` and `[.]` brackets keep each pattern from matching
# its own line here.
[parked_answers]
approve = ["Enter"]
deny = ["Escape"]
approve_guard = ['Do you want to procee[d]\?', '❯ 1[.] Yes']
deny_guard = ['Do you want to procee[d]\?']

# Force Claude Code's classic (inline/scrollback) renderer. The fullscreen TUI
# (research preview, alt-screen ?1049h like vim/htop) repaints in place, so the
# tmux pane capture only ever holds the final frame and the Log tab shows a single
# page. The classic renderer keeps output in native scrollback, so the capture
# scrolls normally and the Log tab reconstructs the whole session. This env var
# overrides any `tui` setting (user/project/local/seeded) per Claude Code docs.
#
# Disable background tasks (issue #109): Claude Code can bias a session toward
# backgrounding Agent/bash work (run_in_background) despite the bmad-dev-auto
# prompt ban on it. A session that ends its turn to await a background sub-agent
# yields a result-less Stop — and if the CLI then exits, the in-process sub-agent
# is stranded mid-implementation with the story stuck in-progress. The var forces
# every subagent and bash call to run synchronously, which is the behavior the
# skill contract already requires; bmad-loop has no background-completion
# re-invocation, so nothing sanctioned is lost. To opt out, copy this profile
# into .bmad-loop/profiles/ and drop the var.
[env]
CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN = "1"
CLAUDE_CODE_DISABLE_BACKGROUND_TASKS = "1"

[hooks]
dialect = "claude-settings-json"
config_path = ".claude/settings.json"
events = { SessionStart = "SessionStart", Stop = "Stop", SessionEnd = "SessionEnd", PreCompact = "PreCompact", Notification = "Notification" }

# Parked-session signals (DW-348): the relay forwards each Notification payload's
# `notification_type`, and these subtypes mean the CLI is waiting on a human. The
# adapter latches one and, where the stall logic would otherwise type a wake
# nudge, withholds it and ends the session as parked (a Stop clears the latch).
#
# `idle_prompt` fires ~60 s after EVERY finished turn, so a dev/review/workflow session
# that ends a turn without a result and then sits idle re-latches after its Stop
# and PAUSES as parked at stall-grace expiry instead of receiving the stall wake
# nudge. That is intended. To restore the wake nudge, copy this profile into
# .bmad-loop/profiles/ and drop the `idle_prompt` line below.
#
# Subtypes verified 2026-09-24 against code.claude.com/docs/en/hooks (12
# documented) and re-checked 2026-09-27; `quota_auto_resume_fired` means the CLI
# already resumed. `elicitation_dialog` / `elicitation_url_dialog` are an MCP
# server's form or open-this-URL dialog, gated like `permission_prompt` (fired
# after ~6 s without typing): a blocking dialog on this session's screen, so they
# map to PermissionPrompt (DW-434). `agent_needs_input` stays unmapped: one
# subtype covers two triggers, and the payload does not say which. One is a
# DIFFERENT (background) session waiting while agent view is open, so mapping it
# would pause a session that is still working. The other, this session asking an
# agent-team teammate's terminal-setup question, needs experimental agent teams,
# which bmad-loop does not enable. Map it in an overlay if your sessions run
# agent teams. `auth_success`, `agent_completed` and the `elicitation_complete` /
# `elicitation_response` follow-ups are not waits. Unmapped subtypes are ignored;
# an overlay may map them to a parked kind.
[hooks.notification_types]
permission_prompt = "PermissionPrompt"
idle_prompt = "IdlePrompt"
quota_auto_resume_stale = "QuotaPrompt"
quota_auto_resume_disabled = "QuotaPrompt"
elicitation_dialog = "PermissionPrompt"
elicitation_url_dialog = "PermissionPrompt"
