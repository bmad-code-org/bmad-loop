# OpenCode (opencode.ai) driven over its local HTTP server (`opencode serve`) —
# hookless: the adapter owns the server process and observes turn completion via
# SSE + polling, so no hook scripts or config merges are ever written.
# API facts pinned against opencode 1.18.2 (2026-07-16): see the adapters/opencode_http.py docstring.
name = "opencode-http"
binary = "opencode"
# Driven by the bundled HTTP/SSE adapter class (adapters/registry.py), not the
# tmux generic adapter — the selector for the coding-CLI adapter axis. Distinct
# from `hooks.dialect = "none"` below, which says only that no hook config is
# ever registered: the two axes are decoupled.
adapter = "opencode-http"
prompt_template = "Use the {skill} skill now: {args}"
usage_parser = "none"
skill_tree = ".claude/skills"
first_run_note = "run `opencode auth login` once on this machine; headless servers reuse the stored credentials"

# Transport/provider environment-fault classification (#194). Unlike the tmux
# adapters, the file scanned for this adapter is logs/<task_id>.server.out — the
# `opencode serve` process's own stdout/stderr, structured logfmt, which the model
# never writes to. So the anchor can be the ai-sdk error class opencode reports in
# the `error.error=` field of a `level=ERROR message="stream error"` line, which is
# both precise and incapable of colliding with story output.
#
# NOT logs/<task_id>.log: that is the curated `[bmad]` conversation transcript and
# it carries the model's own words. These patterns are only safe against a
# model-free log, so the file the classifier reads is part of their contract —
# see EnvFaultMixin.ENV_FAULT_LOG_SUFFIX.
#
# Verified against a real 5-hour provider quota outage: 22 matching lines across
# one run, in two forms — a clean refusal, and the socket drop providers fall
# back to once they stop answering at all:
#   ... message="stream error" ... error.error="AI_APICallError: Usage limit reached for 5 hour. Your limit will reset at 2026-07-26 22:49:46"
#   ... message="stream error" ... error.error="AI_APICallError: Cannot connect to API: The socket connection was closed unexpectedly."
# To disable or extend, copy this profile into .bmad-loop/profiles/ and edit.
# Anchored on the structured field name, not on the error class alone: the server
# reports the failure as `error.error="AI_APICallError: …"` inside a logfmt line.
# The bare class name would also match `const MSG = "AI_APICallError: Usage limit
# reached";` — unreachable in THIS log, but a pattern is copied into project
# overlays and read as an example, so it should not model a weaker rule than it
# means. Deliberately content-anchored rather than position-anchored: this file is
# a byte stream, and the tmux profiles' equivalent is a raw pipe-pane capture full
# of cursor-addressed repaints, so no column or line offset in it is meaningful.
# The gap is [^"], not `.`: it must stay INSIDE the quoted error value. With `.`
# the lazy gap walks past the closing quote and finds a cause word in a later
# logfmt field, so an unrelated `AI_APICallError: Invalid API key` on a line whose
# trailing fields mention a quota path classifies as a quota outage. In every
# captured line the cause is inside the quotes, so nothing real is lost.
#
# OpenCode 2.x writes no server-log line per provider retry (one only when it
# gives up, ~90 s in), so the adapter itself writes logs/<task_id>.provider-errors.log,
# scanned beside .server.out: one line per session.retry.scheduled /
# session.step.failed / session.execution.failed frame, built from the frame's
# structured error fields — event, `type`, `status`, the retry `attempt`, then
# the provider's message quoted LAST with every line break escaped (never its
# response body). The V2 pattern anchors on the line START plus the typed
# error: nothing before `message=` is provider- or model-sourced, and an
# escaped message cannot begin a line, so this one is position-anchored on
# purpose — unlike the stream above, this file is adapter-authored whole lines.
# Only the types captured live are listed: against 2.0.27 (2026-10-12, zero
# tokens, a local mock OpenAI-compatible provider) an HTTP 429 rate limit read
# provider.rate-limit, a 429 or 402 `insufficient_quota` read provider.quota,
# and a refused connection read provider.transport. The lines, as written:
#   provider-error event=session.retry.scheduled type=provider.rate-limit status=429 attempt=2 message="Rate limit reached for requests"
#   provider-error event=session.execution.failed type=provider.quota status=402 attempt=- message="You exceeded your current quota, please check your plan and billing details."
#   provider-error event=session.retry.scheduled type=provider.transport status=- attempt=2 message="ConnectionRefused: Unable to connect. Is the computer able to access the url?"
# The schema's other provider.* types (timeout, auth, no-route, …) are not seeded.
env_fault_patterns = [
  'error[.]error="AI_APICallError: [^"]{0,400}?(?i:usage limit reached|429|too many requests|rate[ _-]?limit|quota|overloaded)',
  'error[.]error="AI_APICallError: [^"]{0,400}?(?i:cannot connect to api|socket connection was closed|connection ?(error|refused|reset|timed ?out)|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN)',
  '^provider-error event=\S+ type=provider[.](?:rate-limit|quota|transport) ',
]
# AI_RetryError (ai-sdk's wrapper once its own retries are exhausted) is
# deliberately NOT seeded. ai-sdk documents the class
# (https://ai-sdk.dev/docs/reference/ai-sdk-errors/ai-retry-error — properties
# only, no example message), but no documented or captured opencode server-log
# line carrying it exists, and a pattern is seeded only from a real line
# (tests/test_env_fault_patterns.py).

[hooks]
dialect = "none"
